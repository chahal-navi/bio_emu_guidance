# Path B: DPS gradient guidance on x0_hat, Ez membrane potential ONLY.
# Kept deliberately as the "membrane term alone" arm so the effect of adding the
# physicality terms (dps_phys.yaml) is attributable. Now clipped and time-windowed:
# the v1 pilot showed an unclipped Ez gradient tears the peptide apart, because Ez
# rewards moving charged residues arbitrarily far from the bilayer.
_target_: bioemu.denoiser.membrane_guided_dpm_solver
_partial_: true
eps_t: 0.001
max_t: 0.99
N: 100
noise: 0.0
guidance_scale: 1.69
guidance_t_max: 0.8      # x0_hat is meaningless near t=1; guiding there is noise
guidance_t_min: 0.0
guide_midpoint: true
backprop_through_model: true
max_guidance_ratio: 0.5  # guidance may never exceed half the model's own score norm
potential:
  _target_: bioemu.steering.custom_potentials.EzMembranePotential
  frame: optimize
  weight: 1.0
