# Path A: BioEmu's built-in SMC steering (resampling only, no gradients) with the Ez potential.
# Upstream uses reward = -potential, so weight = 1/kT gives the same Boltzmann tilt as dps.yaml.
_target_: bioemu.steering.dpm_smc.dpm_solver_smc
_partial_: true
eps_t: 0.001
max_t: 0.99
N: 100
noise: 0.5
fk_potentials:
  - _target_: bioemu.steering.custom_potentials.EzMembranePotential
    frame: optimize
    weight: 1.69
steering_config:
  num_particles: 10
  ess_threshold: 0.5
  start: 0.6
  end: 0.0
